# Build and push a Docker image, then deploy to the dev server, on every push
# to any branch except prod (that is handled by docker-publish.yml). This
# includes main — pushing to main updates the dev server, same as before.
#
# Image tags:  ghcr.io/netsepio/erebrus-webapp:<full-sha>  (immutable)
#              ghcr.io/netsepio/erebrus-webapp:dev          (rolling, dev server pulls this)
#
# Branch name is not used as a tag here (Docker tags forbid "/", and feature
# branches commonly contain it) — fixed "dev" tag used instead.
#
# Mirrors netsepio/erebrus-gateway's docker-publish-dev.yml: no CI gate, deploy
# runs straight off the push via SSH + docker compose with a health check.
# Stack includes its own Caddy (see deploy/docker-compose.dev.yml + Caddyfile.dev)
# on host ports 8080/8443, since gateway's Caddy already owns 80/443 on this box.

name: Docker publish (dev)

on:
  push:
    branches-ignore: [prod]

permissions:
  contents: read
  packages: write

jobs:
  build_push_dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          set -euo pipefail
          echo "$DEV_ENV_FILE" > .env.local
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          SHA_TAG="$IMAGE:${{ github.sha }}"
          DEV_TAG="$IMAGE:dev"
          docker build --build-arg version=${{ github.sha }} -t "$SHA_TAG" -t "$DEV_TAG" .
          docker push "$SHA_TAG"
          docker push "$DEV_TAG"
          rm -f .env.local

  deploy_dev:
    needs: build_push_dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose manifest to dev server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEV_REMOTE_SERVER_KEY }}
          SSH_HOST: ${{ secrets.DEV_REMOTE_SERVER_ADDRESS }}
          SSH_USER: ${{ secrets.DEV_SERVER_USERNAME }}
          SSH_PORT: ${{ secrets.DEV_SSH_PORT }}
        run: |
          set -euo pipefail
          REMOTE_DIR="${WEBAPP_DIR_DEV:-webapp}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p "${SSH_PORT:-22}")
          # scp uses -P (uppercase) for port; ssh uses -p (lowercase).
          SCP_OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -P "${SSH_PORT:-22}")
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          ssh "${SSH_OPTS[@]}" "$SSH_TARGET" "mkdir -p ~/${REMOTE_DIR}"
          scp "${SCP_OPTS[@]}" deploy/docker-compose.dev.yml deploy/Caddyfile.dev "${SSH_TARGET}:~/${REMOTE_DIR}/"

      - name: Deploy to dev
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_REMOTE_SERVER_ADDRESS }}
          username: ${{ secrets.DEV_SERVER_USERNAME }}
          key: ${{ secrets.DEV_REMOTE_SERVER_KEY }}
          port: ${{ secrets.DEV_SSH_PORT }}
          script: |
            set -euo pipefail
            WEBAPP_DIR="${WEBAPP_DIR_DEV:-$HOME/webapp}"
            export WEBAPP_IMAGE=ghcr.io/netsepio/erebrus-webapp:dev
            export WEBAPP_CONTAINER_NAME=erebrus-frontend-dev

            cd "$WEBAPP_DIR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d --remove-orphans

            for i in $(seq 1 30); do
              curl -fsS --max-time 2 http://127.0.0.1:4041/ && break
              sleep 1
            done
