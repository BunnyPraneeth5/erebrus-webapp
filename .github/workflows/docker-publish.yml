# Build and push a Docker image, then deploy to the prod server, on every
# push to prod. main is handled by docker-publish-dev.yml (dev server).
#
# Image tags:  ghcr.io/netsepio/erebrus-webapp:<full-sha>  (immutable)
#              ghcr.io/netsepio/erebrus-webapp:prod         (rolling, prod server pulls this)
#
# Mirrors netsepio/erebrus-gateway's docker-publish.yml: no CI gate, deploy
# runs straight off the push via SSH + docker compose with a health check.

name: Docker publish

on:
  push:
    branches: [prod]

permissions:
  contents: read
  packages: write

jobs:
  build_push_prod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push image
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          set -euo pipefail
          echo "$PROD_ENV_FILE" > .env
          IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}
          SHA_TAG="$IMAGE:${{ github.sha }}"
          PROD_TAG="$IMAGE:prod"
          docker build --build-arg version=${{ github.sha }} -t "$SHA_TAG" -t "$PROD_TAG" .
          docker push "$SHA_TAG"
          docker push "$PROD_TAG"
          rm -f .env

  deploy_prod:
    needs: build_push_prod
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Copy compose manifest to prod server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_REMOTE_SERVER_KEY }}
          SSH_HOST: ${{ secrets.PROD_REMOTE_SERVER_ADDRESS }}
          SSH_USER: ${{ secrets.PROD_SERVER_USERNAME }}
          SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          REMOTE_DIR="${WEBAPP_DIR_PROD:-webapp}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -p "${SSH_PORT:-22}")
          # scp uses -P (uppercase) for port; ssh uses -p (lowercase).
          SCP_OPTS=(-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -P "${SSH_PORT:-22}")
          SSH_TARGET="${SSH_USER}@${SSH_HOST}"
          ssh "${SSH_OPTS[@]}" "$SSH_TARGET" "mkdir -p ~/${REMOTE_DIR}"
          scp "${SCP_OPTS[@]}" deploy/docker-compose.yml "${SSH_TARGET}:~/${REMOTE_DIR}/"

      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_REMOTE_SERVER_ADDRESS }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_REMOTE_SERVER_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            set -euo pipefail
            WEBAPP_DIR="${WEBAPP_DIR_PROD:-$HOME/webapp}"
            export WEBAPP_IMAGE=ghcr.io/netsepio/erebrus-webapp:prod
            export WEBAPP_CONTAINER_NAME=erebrus-frontend

            cd "$WEBAPP_DIR"
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans

            for i in $(seq 1 30); do
              curl -fsS --max-time 2 http://127.0.0.1:4040/ && break
              sleep 1
            done
