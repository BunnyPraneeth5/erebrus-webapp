# Dev-server webapp stack: webapp + Caddy.
# NEXT_PUBLIC_* vars are baked into the image at build time (see
# docker-publish-dev.yml), so no runtime .env is needed here — unlike the
# gateway, which reads secrets at startup.
#
# Gateway's own Caddy already owns host 80/443 on this box (see
# erebrus-gateway/deploy/docker-compose.dev.yml), so this Caddy binds 8080/8443
# instead. It can't complete a public ACME challenge on those ports, so :443
# uses Caddy's self-signed "tls internal" — fine for internal/dev use behind a
# CDN (e.g. Cloudflare) or direct IP:port testing. Wire real public TLS later
# via a DNS-01 challenge or a shared edge proxy.
#
# https://dev.v1.erebrus.io (via 8080/8443) -> caddy -> webapp:3000

name: erebrus-webapp-dev

services:
  webapp:
    image: ${WEBAPP_IMAGE:-ghcr.io/netsepio/erebrus-webapp:dev}
    container_name: ${WEBAPP_CONTAINER_NAME:-erebrus-frontend-dev}
    restart: unless-stopped
    ports:
      # Local health checks / CI curl only — public access goes through caddy.
      - "127.0.0.1:${WEBAPP_HOST_PORT:-4041}:3000"
    networks:
      - erebrus_webapp_dev_network
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    container_name: erebrus-webapp-caddy-dev
    restart: unless-stopped
    ports:
      - "0.0.0.0:8080:80"
      - "0.0.0.0:8443:443"
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data_dev:/data
      - caddy_config_dev:/config
    networks:
      - erebrus_webapp_dev_network
    depends_on:
      webapp:
        condition: service_healthy

networks:
  erebrus_webapp_dev_network:

volumes:
  caddy_data_dev:
  caddy_config_dev:
